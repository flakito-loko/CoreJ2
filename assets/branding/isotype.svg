<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="JavaOne isotype">
  <defs>
    <linearGradient id="lcd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- phone body -->
  <rect x="34" y="14" width="60" height="100" rx="12" fill="#0B1220" stroke="#2563EB" stroke-width="4"/>
  <!-- earpiece -->
  <rect x="54" y="22" width="20" height="4" rx="2" fill="#94A3B8" opacity="0.55"/>
  <!-- LCD -->
  <rect x="42" y="32" width="44" height="52" rx="6" fill="url(#lcd)"/>
  <!-- geometric mark: diamond (embedded core) -->
  <path d="M64 42 L74 52 L64 62 L54 52 Z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="58" y="50" width="12" height="4" rx="1" fill="#0B1220" opacity="0.35"/>
  <!-- keypad dots (retro) -->
  <circle cx="50" cy="96" r="3.2" fill="#60A5FA"/>
  <circle cx="64" cy="96" r="3.2" fill="#60A5FA"/>
  <circle cx="78" cy="96" r="3.2" fill="#60A5FA"/>
  <circle cx="50" cy="106" r="3.2" fill="#94A3B8"/>
  <circle cx="64" cy="106" r="3.2" fill="#94A3B8"/>
  <circle cx="78" cy="106" r="3.2" fill="#94A3B8"/>
</svg>
