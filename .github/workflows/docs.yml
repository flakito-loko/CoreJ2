name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "compatibility/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Sync compatibility into docs
        run: python scripts/docs/sync_compatibility.py

      - name: Build MkDocs site
        run: mkdocs build

      # Keep ~50MB device MP4s in git for download links, but omit them from the
      # Pages artifact so GitHub Pages deployment does not stall in `deployment_queued`.
      - name: Omit large videos from Pages artifact
        run: rm -rf site/assets/videos

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Large media (videos/GIFs) can keep the Pages deployment queued >10m.
          timeout: 1800000
