name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "compatibility/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Sync compatibility into docs
        run: python scripts/docs/sync_compatibility.py

      - name: Build MkDocs site
        run: mkdocs build

      # Keep ~50MB device MP4s in git for download links, but omit them from the
      # published site so GitHub Pages stays reliable after the CoreJ2 rename.
      - name: Omit large videos from published site
        run: rm -rf site/assets/videos

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
